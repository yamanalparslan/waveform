<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}LuminMind{% endblock %} · LuminMind</title>
<style>
:root{--bg:#0f131a;--panel:#171d27;--panel2:#1e2633;--line:#2a3342;--text:#e6ebf2;
--muted:#8b95a7;--accent:#3fa9f5;--good:#2ea87e;--warn:#e3b341;--bad:#d9634c}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}
header{display:flex;align-items:center;gap:24px;padding:14px 28px;background:var(--panel);
border-bottom:1px solid var(--line)}
header .logo{font-weight:700;font-size:17px;color:var(--text)}
header .logo span{color:var(--accent)}
header nav{display:flex;gap:18px}
header nav a{color:var(--muted)} header nav a.active,header nav a:hover{color:var(--text)}
header .user{margin-left:auto;color:var(--muted);font-size:13px;display:flex;gap:12px;align-items:center}
main{max-width:1080px;margin:0 auto;padding:26px 28px}
h1{font-size:21px;margin-bottom:4px} h2{font-size:16px;margin:22px 0 10px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.card h3{font-size:15px;margin-bottom:8px}
.kpi{display:flex;gap:26px;margin-top:10px}
.kpi div b{display:block;font-size:20px} .kpi div span{color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
.badge.warning{background:#3d3420;color:var(--warn)} .badge.critical{background:#3d2420;color:var(--bad)}
.badge.open{background:#203040;color:var(--accent)} .badge.acked{background:#2c3444;color:var(--muted)}
.badge.resolved{background:#1f3a30;color:var(--good)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.chart{width:100%;height:auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tick{fill:var(--muted);font-size:11px} .chart .unit{font-weight:600}
.chart-empty{fill:var(--muted);font-size:14px}
form.inline{display:inline}
button,.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
padding:6px 14px;border-radius:7px;font-size:13px;cursor:pointer}
button:hover{border-color:var(--accent)}
input,select{background:var(--panel2);border:1px solid var(--line);color:var(--text);
padding:8px 12px;border-radius:7px;font-size:14px;width:100%}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.error{background:#3d2420;color:var(--bad);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px}
.info{background:#203040;color:var(--accent);padding:10px 14px;border-radius:8px;font-size:14px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.toolbar form{display:flex;gap:8px;align-items:center} .toolbar input{width:auto}
.revenue{font-size:24px;font-weight:700;color:var(--good)}
</style>
{% block head %}{% endblock %}
</head>
<body>
{% if user %}
<header>
  <a class="logo" href="/ui">Lumin<span>Mind</span></a>
  <nav>
    <a href="/ui" class="{{ 'active' if section == 'overview' }}">Genel Bakış</a>
    <a href="/ui/harita" class="{{ 'active' if section == 'map' }}">Harita</a>
    {% if plant %}
    <a href="/ui/plants/{{ plant.id }}" class="{{ 'active' if section == 'plant' }}">Tesis</a>
    <a href="/ui/plants/{{ plant.id }}/anomalies" class="{{ 'active' if section == 'anomalies' }}">Anomaliler</a>
    <a href="/ui/plants/{{ plant.id }}/arbitrage" class="{{ 'active' if section == 'arbitrage' }}">Arbitraj</a>
    {% endif %}
  </nav>
  <div class="user">
    {{ user.email }}
    <form class="inline" method="post" action="/ui/logout"><button>Çıkış</button></form>
  </div>
</header>
{% endif %}
<main>{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
