[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "luminmind"
version = "0.1.0"
description = "Cloud API-based solar plant monitoring, digital twin and BESS energy arbitrage platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    # Üst sınırlar pip resolver'ın Docker build'inde takıldığı çözüm patlamasını
    # önlemek için: sürümleri bilinen çalışan aralıklara sabitliyoruz. Yükseltme
    # bilinçli bir kararla, tam test suit yeşilken yapılmalı.
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "httpx>=0.27,<0.29",
    "httpcore>=1.0,<2.0",
    "celery[redis]>=5.4,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.29,<0.32",
    "alembic>=1.13,<2.0",
    "influxdb-client[async]>=1.44,<2.0",
    "cryptography>=42.0,<50.0",
    "pvlib>=0.11,<0.16",
    "pandas>=2.0,<4.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.11,<2.0",
    "fastapi>=0.111,<1.0",
    "starlette>=0.46,<2.0",
    "uvicorn>=0.30,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
luminmind = ["py.typed", "web/templates/*.html"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "ANN", # flake8-annotations (tip anotasyonu zorunlu)
    "ASYNC",
]
ignore = [
    "ANN401", # Any'ye izin: üretici JSON'ları için gerekli
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["luminmind"]

[[tool.mypy.overrides]]
module = ["celery.*", "influxdb_client.*", "pvlib.*", "pandas.*", "scipy.*"]
ignore_missing_imports = true

# pvlib/pandas tip bildirimi taşımıyor; twin modüllerinde untyped çağrılara izin
[[tool.mypy.overrides]]
module = "luminmind.twin.*"
disallow_untyped_calls = false
warn_return_any = false

# influxdb-client py.typed taşıyor ama tip bildirimi eksik; bu modülde untyped
# çağrılara izin veriyoruz
[[tool.mypy.overrides]]
module = ["luminmind.core.influx", "luminmind.scripts.bootstrap_influx"]
disallow_untyped_calls = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::RuntimeWarning"]
