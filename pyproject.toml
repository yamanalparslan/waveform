[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "luminmind"
version = "0.1.0"
description = "Cloud API-based solar plant monitoring, digital twin and BESS energy arbitrage platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "celery[redis]>=5.4",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "influxdb-client[async]>=1.44",
    "cryptography>=42.0",
    "pvlib>=0.11",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# `web/static/*` olmadan tekerlek ve Docker imajı CSS'i taşımaz; sayfa
# stilsiz açılır ve hata da vermez (404 yalnızca tarayıcı konsolunda görünür).
luminmind = ["py.typed", "web/templates/*.html", "web/static/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "ANN", # flake8-annotations (tip anotasyonu zorunlu)
    "ASYNC",
]
ignore = [
    "ANN401", # Any'ye izin: üretici JSON'ları için gerekli
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["luminmind"]

[[tool.mypy.overrides]]
module = ["celery.*", "influxdb_client.*", "pvlib.*", "pandas.*", "scipy.*"]
ignore_missing_imports = true

# pvlib/pandas tip bildirimi taşımıyor; twin modüllerinde untyped çağrılara izin
[[tool.mypy.overrides]]
module = "luminmind.twin.*"
disallow_untyped_calls = false
warn_return_any = false

# influxdb-client py.typed taşıyor ama tip bildirimi eksik; bu modülde untyped
# çağrılara izin veriyoruz
[[tool.mypy.overrides]]
module = ["luminmind.core.influx", "luminmind.scripts.bootstrap_influx"]
disallow_untyped_calls = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::RuntimeWarning"]
