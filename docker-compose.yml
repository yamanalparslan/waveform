services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: luminmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: luminmind
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luminmind"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Depo servisleri de yeniden başlamalı. Uygulama servisleri
    # (api/worker/beat) `unless-stopped` taşırken depoların taşımaması
    # asimetrik bir arıza üretiyordu: Docker Desktop yeniden başladığında
    # (WSL güncellemesi, host uykusu, bellek baskısı) postgres/influxdb/redis
    # `Exited (255)` ile ölüp bir daha kalkmıyor, ama worker çekmeye devam edip
    # her noktayı çöpe atıyordu. 31.07.2026'da tam bu oldu: panel günlük
    # üretimi 32 kWh gösterdi, gerçek 2.679 kWh idi.
    restart: unless-stopped
    # Port yayınlanmaz: veritabanına yalnızca compose ağındaki servisler erişir.
    # Dışarıdan bakmak için: docker compose exec postgres psql -U luminmind
    # (Geliştirme aracıyla bağlanmak isterseniz compose.override ile
    #  "127.0.0.1:5432:5432" ekleyin — asla "5432:5432" değil.)

  influxdb:
    image: influxdb:2.7-alpine
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: luminmind
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-changeme123}
      DOCKER_INFLUXDB_INIT_ORG: luminmind
      DOCKER_INFLUXDB_INIT_BUCKET: lm_raw
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-changeme}
    volumes:
      - influx_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Influx arayüzü admin token'ı taşır; internete açık makinede yayınlanmaz.

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Redis'in kimlik doğrulaması yok; yayınlanırsa kuyruk herkese açılır.

  # Tek seferlik kurulum: migration + Influx bucket'ları + seed
  init:
    build: .
    # Sıra önemli: şema → Influx bucket'ları → admin/demo tohumu → saha yapısı.
    # bootstrap_sites en sonda çünkü eski düz tesisleri emip sahalara bağlıyor.
    command: >
      sh -c "alembic upgrade head
      && python -m luminmind.scripts.bootstrap_influx
      && python -m luminmind.scripts.seed
      && python -m luminmind.scripts.bootstrap_sites"
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql+asyncpg://luminmind:${POSTGRES_PASSWORD:-changeme}@postgres:5432/luminmind
      INFLUX_URL: http://influxdb:8086
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  api:
    build: .
    # --proxy-headers: tünel/ters vekil arkasında istemci IP'si ve şeması doğru
    # okunsun (giriş hız sınırı gerçek IP'yi görmeli).
    command: >
      uvicorn luminmind.api.main:app --host 0.0.0.0 --port 8000
      --reload --reload-include '*.html' --proxy-headers --forwarded-allow-ips=*
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql+asyncpg://luminmind:${POSTGRES_PASSWORD:-changeme}@postgres:5432/luminmind
      INFLUX_URL: http://influxdb:8086
    ports:
      # Yalnızca localhost'a bağlanır. Dış dünyaya açılış cloudflared üzerinden
      # yapılır; bu satırı "8000:8000" yapmak paneli yerel ağın tamamına açar.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  # Cloudflare Tunnel — sunucuda hiçbir port açmadan paneli alan adınıza bağlar.
  # Bağlantı içeriden dışarıya kurulur; yönlendirme/DDNS/sertifika gerekmez.
  # Etkinleştirmek için .env içine CLOUDFLARE_TUNNEL_TOKEN yazın:
  #   docker compose --profile public up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      # `:?` zorunlu-değişken biçimi kullanılmaz: değişken yorumlaması profil
      # aktif olmasa da çalışır ve token yokken sıradan `docker compose up`
      # komutunu da kırardı. Token boşsa yalnızca bu servis başlatılamaz.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles: ["public"]
    restart: unless-stopped
    depends_on:
      - api

  worker:
    build: .
    command: celery -A luminmind.workers.celery_app worker --loglevel=INFO
    volumes:
      - ./src:/app/src
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql+asyncpg://luminmind:${POSTGRES_PASSWORD:-changeme}@postgres:5432/luminmind
      INFLUX_URL: http://influxdb:8086
    # host.docker.internal → host makinedeki Tescom API'sine (port 8503) erişim
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  beat:
    build: .
    command: celery -A luminmind.workers.celery_app beat --loglevel=INFO
    volumes:
      - ./src:/app/src
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pg_data:
  influx_data:
